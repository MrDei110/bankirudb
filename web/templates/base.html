<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Банки · Архив отзывов{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="bar"><div class="shell bar-inner">
    <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark" aria-hidden="true">Б</span> Архив отзывов</a>
    {% if not config.DEMO_DATA %}<span class="bar-note">Учебный корпус · Banki.ru</span>{% endif %}
  </div></header>
  <main class="shell">
    {% if config.DEMO_DATA %}<p class="quiet">Демо · Все банки и отзывы вымышлены</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
